name: Satellite imagery scrape

on:
  # GitHubの schedule トリガーはbest-effort（努力目標）で不安定なため使わない。
  # 外部の無料cronサービス(cron-job.org等)からこの workflow_dispatch APIエンドポイントを
  # 定期的に叩く運用にする（geoplot-milプロジェクトと同じ方式。詳細はREADME参照）。
  # lookback_days は通常は既定値(3)のままでよい。初回の年間バックフィル等、
  # 手動で「Run workflow」から実行する際だけ大きな値（例: 365）を指定する。
  # cron-job.org経由（inputsを指定しないAPI呼び出し）の場合は自動的に既定値が使われる。
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '検索の遡及日数（通常3のままでOK。初回バックフィル時のみ365等に変更）'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: satellite-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # GitHub-hostedランナーのジョブタイムアウトは既定6時間。1000日分のような
    # 大規模バックフィルはこれを超えることがあるため長めに確保しておく
    # （2026-08、6時間ちょうどでタイムアウトし、当時は未pushの成果が全損した
    # 反省。現在はsatellite_scraper.py側のチェックポイント機構で緩和済みだが、
    # 念のためタイムアウト自体にも余裕を持たせる）。
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        env:
          MGP_API_KEY: ${{ secrets.MGP_API_KEY }}
        # satellite_scraper.py自体が一定チャンク数ごとにシャードをコミット・push
        # する（--checkpoint-every、既定10）。長時間ランの途中でジョブが落ちても、
        # 直前のチェックポイントまでの成果はこの時点でGitHubに反映済みになる。
        run: python satellite_scraper.py --once --out-dir satellite_out --branch main --lookback-days ${{ github.event.inputs.lookback_days }}

      - name: Final commit (safety net + legacy migration)
        # 通常運用では、直前のスクレイパー実行内のチェックポイントで既に
        # コミット・push済みのため、ここでは基本的に「差分なし」になる。
        # 万一チェックポイントが取りこぼした分（最後の端数チャンク等）や、
        # 旧形式（state.json単一ファイル）が残っている場合の移行をここで拾う。
        run: python commit_state.py --out-dir satellite_out --branch main
