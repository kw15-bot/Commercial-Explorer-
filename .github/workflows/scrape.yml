name: Satellite imagery scrape

on:
  # GitHubの schedule トリガーはbest-effort（努力目標）で不安定なため使わない。
  # 外部の無料cronサービス(cron-job.org等)からこの workflow_dispatch APIエンドポイントを
  # 定期的に叩く運用にする（geoplot-milプロジェクトと同じ方式。詳細はREADME参照）。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: satellite-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          MGP_API_KEY: ${{ secrets.MGP_API_KEY }}
        run: python satellite_scraper.py --once --out-dir satellite_out

      - name: Commit updated geojson/state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python commit_state.py --out-dir satellite_out --branch main
